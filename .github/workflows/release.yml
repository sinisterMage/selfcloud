name: release

# Tag-triggered release workflow. Pushing a `vX.Y.Z` tag builds the
# dashboard, cross-compiles the Go binary for linux/{amd64,arm64} and the
# terraform-provider, generates SHA-256 checksums, and publishes the
# binaries plus checksums to a GitHub Release. install.sh expects this
# layout (releases/latest/download/selfcloud-linux-<arch>(.sha256)).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build dashboard
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../internal/api/web_dist
          cp -r dist/* ../internal/api/web_dist/

      - name: Build selfcloud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          ASSET="selfcloud-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/selfcloud/selfcloud/internal/version.Version=${GITHUB_REF_NAME} \
              -X github.com/selfcloud/selfcloud/internal/version.Commit=$(git rev-parse --short HEAD)" \
            -o "out/${ASSET}" ./cmd/selfcloud
          (cd out && sha256sum "${ASSET}" > "${ASSET}.sha256")

      - name: Build terraform-provider
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ASSET="terraform-provider-selfcloud-${{ matrix.goos }}-${{ matrix.goarch }}"
          (cd terraform-provider-selfcloud && \
            go build -trimpath -ldflags "-s -w" \
              -o "../out/${ASSET}" .)
          (cd out && sha256sum "${ASSET}" > "${ASSET}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: selfcloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show artifacts
        run: ls -la artifacts/
      - name: Combined checksums
        run: |
          (cd artifacts && cat *.sha256 > SHA256SUMS && rm -f SHA256SUMS.sha256)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
